version: 2.1
jobs:
  build-staging:
    machine:
      image: ubuntu-1604:201903-01
    steps:
      - checkout

      - run:
          name: Build docker staging
          command: |
            echo $DOCKER_PASS | docker login -u $DOCKER_USER --password-stdin
            TAG=staging
            docker build --build-arg MODE=$TAG -t $DOCKER_USER/buaansach:cms-ui-staging .
            docker push $DOCKER_USER/buaansach:cms-ui-staging
  build-production:
    machine:
      image: ubuntu-1604:201903-01
    steps:
      - checkout

      - run:
          name: Build docker production
          command: |
            echo $DOCKER_PASS | docker login -u $DOCKER_USER --password-stdin
            TAG=production
            docker build --build-arg MODE=$TAG -t $DOCKER_USER/buaansach:cms-ui-production .
            docker push $DOCKER_USER/buaansach:cms-ui-production
workflows:
  build-image:
    jobs:
      # - build
      - build-staging:
          filters:
            branches:
              only:
                - master
      - hold:
          type: approval
          requires:
            - build-staging
      - build-production:
          requires:
            - hold
