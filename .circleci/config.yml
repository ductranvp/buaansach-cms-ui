version: 2.1
jobs:
  deploy-staging:
    machine:
      image: ubuntu-1604:201903-01
    steps:
      - checkout

      - run:
          name: Build docker
          command: |
            echo $DOCKER_PASS | docker login -u $DOCKER_USER --password-stdin $DOCKER_HUB
            TAG=staging
            docker build --build-arg MODE=staging -t $DOCKER_HUB/cms-ui:$TAG .
            docker push $DOCKER_HUB/cms-ui:$TAG

      - run:
          name: Deploy
          command: |
            TAG=staging
            # ssh root@$STAGING_DOMAIN
            ssh root@$DOCKER_HUB "echo $DOCKER_PASS | docker login -u $DOCKER_USER --password-stdin $DOCKER_HUB && docker pull $DOCKER_HUB/cms-ui:$TAG"
workflows:
  build-and-test:
    jobs:
      # - build
      - deploy-staging
